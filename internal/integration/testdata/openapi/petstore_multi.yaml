openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      responses:
        '200':
          description: A list of pets
    post:
      operationId: createPet
      responses:
        '201':
          description: Created
  /pets/{id}:
    get:
      operationId: getPetById
      tags: [pets]
      responses:
        '200':
          description: A pet
